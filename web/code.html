<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>source code</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/go.min.js"></script>
<style>
:root {
  --bg: #fafafa;
  --fg: #1a1a1a;
  --fg-muted: #636363;
  --surface: #f0f0f0;
  --border: #d8d8d8;
  --accent: #2255aa;
  --code-bg: #f4f4f4;
  --link: #1a6b47;
  --line-nr: #b0b0b0;
  --active-bg: #e6edf5;
  --font-body: 'IBM Plex Sans', system-ui, sans-serif;
  --font-mono: 'IBM Plex Mono', ui-monospace, monospace;
  --hl-keyword: #7b30d0;
  --hl-string: #0f7d35;
  --hl-number: #1a6b47;
  --hl-comment: #8a8a8a;
  --hl-type: #2d5a27;
  --hl-func: #1a1a1a;
  --hl-built-in: #9e4f00;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #111111;
    --fg: #e0e0e0;
    --fg-muted: #8a8a8a;
    --surface: #1a1a1a;
    --border: #2a2a2a;
    --accent: #6a9fff;
    --code-bg: #161616;
    --link: #4dab7a;
    --line-nr: #555;
    --active-bg: #1c2230;
    --hl-keyword: #c792ea;
    --hl-string: #a5d6a7;
    --hl-number: #4dab7a;
    --hl-comment: #636363;
    --hl-type: #5a9e50;
    --hl-func: #e0e0e0;
    --hl-built-in: #ffab40;
    color-scheme: dark;
  }
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.6;
}

.shell {
  max-width: 1100px;
  margin: 0 auto;
  padding: 1.5rem 20px 4rem;
}
.top-bar {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 1rem;
  font-family: var(--font-mono);
  font-size: 14px;
  font-weight: 600;
  color: var(--fg);
}
.top-bar svg { flex-shrink: 0; color: var(--accent); }
.top-bar .back { margin-left: auto; font-size: 12px; font-weight: 400; color: var(--fg-muted); text-decoration: none; }
.top-bar .back:hover { color: var(--fg); }

.panels {
  display: flex;
  gap: 0;
  border: 1px solid var(--border);
  border-radius: 6px;
  overflow: hidden;
  min-height: 500px;
}

/* Left: file sidebar */
.sidebar {
  width: 220px;
  min-width: 220px;
  background: var(--surface);
  border-right: 1px solid var(--border);
  overflow-y: auto;
}
.sidebar-header {
  padding: 8px 12px;
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 600;
  color: var(--fg-muted);
  text-transform: uppercase;
  letter-spacing: 0.05em;
  border-bottom: 1px solid var(--border);
}
.file-list {
  list-style: none;
  margin: 0;
  padding: 4px 0;
}
.file-list li a {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 5px 12px;
  text-decoration: none;
  color: var(--fg);
  font-family: var(--font-mono);
  font-size: 12.5px;
  cursor: pointer;
  transition: background 0.1s;
  border-left: 2px solid transparent;
}
.file-list li a:hover { background: var(--border); }
.file-list li a.active {
  background: var(--active-bg);
  border-left-color: var(--accent);
  color: var(--fg);
  font-weight: 500;
}
.file-icon { flex-shrink: 0; color: var(--fg-muted); width: 14px; height: 14px; }
.dir-icon { flex-shrink: 0; color: var(--accent); width: 14px; height: 14px; }
.dir-label {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 5px 12px;
  font-family: var(--font-mono);
  font-size: 12.5px;
  color: var(--fg-muted);
  font-weight: 500;
  border-left: 2px solid transparent;
  margin-top: 4px;
}

/* Right: content viewer */
.viewer {
  flex: 1;
  min-width: 0;
  background: var(--bg);
  display: flex;
  flex-direction: column;
}
.viewer-header {
  background: var(--surface);
  padding: 8px 14px;
  font-family: var(--font-mono);
  font-size: 13px;
  font-weight: 500;
  color: var(--fg);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 8px;
  flex-shrink: 0;
}
.viewer-header .meta {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 8px;
  color: var(--fg-muted);
  font-weight: 400;
  font-size: 12px;
}
.raw-btn {
  background: none;
  border: 1px solid var(--border);
  border-radius: 4px;
  color: var(--fg-muted);
  font-family: var(--font-mono);
  font-size: 11px;
  padding: 2px 8px;
  cursor: pointer;
  text-decoration: none;
  transition: color 0.1s, border-color 0.1s;
}
.raw-btn:hover { color: var(--fg); border-color: var(--fg-muted); }
.viewer-body {
  flex: 1;
  overflow: auto;
}

/* Rendered markdown */
.md-body { padding: 1.5rem; }
.md-body h1 { font-size: 1.6rem; font-weight: 600; margin: 0 0 0.5rem; }
.md-body h2 { font-size: 1.15rem; font-weight: 600; margin: 1.8rem 0 0.6rem; padding-bottom: 0.3rem; border-bottom: 1px solid var(--border); }
.md-body h3 { font-size: 1rem; font-weight: 600; margin: 1.3rem 0 0.4rem; }
.md-body p { margin: 0 0 0.9rem; }
.md-body ul, .md-body ol { margin: 0 0 0.9rem; padding-left: 1.5rem; }
.md-body li { margin-bottom: 0.2rem; }
.md-body a { color: var(--link); text-decoration: none; }
.md-body a:hover { text-decoration: underline; }
.md-body strong { font-weight: 600; }
.md-body code {
  font-family: var(--font-mono);
  font-size: 0.88em;
  background: var(--code-bg);
  padding: 0.15em 0.35em;
  border-radius: 3px;
}
.md-body pre {
  background: var(--code-bg);
  border-radius: 6px;
  padding: 1rem;
  overflow-x: auto;
  margin: 0 0 1rem;
  line-height: 1.5;
}
.md-body pre code { background: none; padding: 0; font-size: 13px; }

/* Code table */
.code-table {
  width: 100%;
  border-collapse: collapse;
  font-family: var(--font-mono);
  font-size: 13px;
  line-height: 1.55;
  display: block;
}
.code-table td { vertical-align: top; padding: 0; }
.code-table .line-nr {
  width: 1px;
  white-space: nowrap;
  text-align: right;
  padding: 0 12px 0 14px;
  color: var(--line-nr);
  user-select: none;
  -webkit-user-select: none;
}
.code-table .line-code {
  padding: 0 14px 0 0;
  white-space: pre;
  min-width: 0;
}
.code-table tr:first-child td { padding-top: 10px; }
.code-table tr:last-child td { padding-bottom: 10px; }

.loading {
  color: var(--fg-muted);
  font-family: var(--font-mono);
  font-size: 13px;
  padding: 2rem;
  text-align: center;
}

/* highlight.js overrides */
.hljs { background: transparent; color: var(--fg); }
.hljs-keyword, .hljs-selector-tag { color: var(--hl-keyword); }
.hljs-string, .hljs-doctag { color: var(--hl-string); }
.hljs-number, .hljs-literal { color: var(--hl-number); }
.hljs-comment { color: var(--hl-comment); font-style: italic; }
.hljs-type, .hljs-class .hljs-title { color: var(--hl-type); }
.hljs-function .hljs-title, .hljs-title.function_ { color: var(--hl-func); }
.hljs-built_in { color: var(--hl-built-in); }
.hljs-params { color: var(--fg); }
.hljs-attr, .hljs-attribute { color: var(--hl-type); }
.hljs-meta, .hljs-meta .hljs-keyword { color: var(--hl-keyword); }
.hljs-symbol { color: var(--hl-number); }

/* Mobile: stack vertically */
@media (max-width: 700px) {
  .panels {
    flex-direction: column;
    min-height: auto;
  }
  .sidebar {
    width: 100%;
    min-width: 100%;
    border-right: none;
    border-bottom: 1px solid var(--border);
    max-height: 45vh;
  }
  .viewer { min-height: 400px; }
}
</style>
</head>
<body>

<div class="shell">
  <div class="top-bar">
    <svg width="18" height="18" viewBox="0 0 16 16" fill="currentColor"><path d="M1.75 1A1.75 1.75 0 000 2.75v10.5C0 14.216.784 15 1.75 15h12.5A1.75 1.75 0 0016 13.25v-8.5A1.75 1.75 0 0014.25 3H7.5a.25.25 0 01-.2-.1l-.9-1.2C6.07 1.26 5.55 1 5 1H1.75z"/></svg>
    creditnet
    <a class="back" href="index.html">&larr; back</a>
  </div>

  <div class="panels">
    <div class="sidebar" id="sidebar">
      <div class="sidebar-header">Files</div>
      <div class="loading" id="files-loading">loading...</div>
    </div>

    <div class="viewer">
      <div class="viewer-header" id="viewer-header">
        <span id="viewer-filename">README.md</span>
        <div class="meta">
          <span id="viewer-lines"></span>
          <a class="raw-btn" id="viewer-raw" href="#" target="_blank">raw</a>
        </div>
      </div>
      <div class="viewer-body" id="viewer-body">
        <div class="loading">loading...</div>
      </div>
    </div>
  </div>
</div>

<script>
var SKIP = {'.git':1, 'vendor':1, 'web':1};
var currentFile = null;
var fileCache = {};

function escapeHtml(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function fileIconSvg() {
  return '<svg class="file-icon" width="14" height="14" viewBox="0 0 16 16" fill="currentColor"><path d="M3.75 1.5a.25.25 0 00-.25.25v12.5c0 .138.112.25.25.25h8.5a.25.25 0 00.25-.25V4.664a.25.25 0 00-.073-.177l-2.914-2.914a.25.25 0 00-.177-.073H3.75z"/></svg>';
}

function dirIconSvg() {
  return '<svg class="dir-icon" width="14" height="14" viewBox="0 0 16 16" fill="currentColor"><path d="M1.75 1A1.75 1.75 0 000 2.75v10.5C0 14.216.784 15 1.75 15h12.5A1.75 1.75 0 0016 13.25v-8.5A1.75 1.75 0 0014.25 3H7.5a.25.25 0 01-.2-.1l-.9-1.2C6.07 1.26 5.55 1 5 1H1.75z"/></svg>';
}

function langForFile(name) {
  if (name.endsWith('.go')) return 'go';
  if (name.endsWith('.mod') || name.endsWith('.sum')) return 'plaintext';
  if (name.endsWith('.md')) return 'markdown';
  if (name.endsWith('.json')) return 'json';
  if (name.endsWith('.html')) return 'xml';
  if (name.endsWith('.sh')) return 'bash';
  return 'plaintext';
}

function setActive(name) {
  var links = document.querySelectorAll('.file-list a');
  for (var i = 0; i < links.length; i++) {
    if (links[i].getAttribute('data-file') === name) {
      links[i].classList.add('active');
    } else {
      links[i].classList.remove('active');
    }
  }
}

async function viewFile(name, basePath) {
  if (name === currentFile) return;
  currentFile = name;
  setActive(name);
  document.getElementById('viewer-filename').textContent = name;
  document.getElementById('viewer-raw').href = basePath + name;
  document.getElementById('viewer-body').innerHTML = '<div class="loading">loading...</div>';
  document.getElementById('viewer-lines').textContent = '';

  try {
    var text;
    if (fileCache[basePath + name] != null) {
      text = fileCache[basePath + name];
    } else {
      var res = await fetch(basePath + name);
      if (!res.ok) throw new Error();
      text = await res.text();
      fileCache[basePath + name] = text;
    }
    var lines = text.split('\n');
    if (lines.length > 0 && lines[lines.length - 1] === '') lines.pop();
    document.getElementById('viewer-lines').textContent = lines.length + ' lines';

    var lang = langForFile(name);

    if (lang === 'markdown') {
      document.getElementById('viewer-body').innerHTML =
        '<div class="md-body">' + marked.parse(text) + '</div>';
      return;
    }

    var highlighted = null;
    if (lang !== 'plaintext') {
      try { highlighted = hljs.highlight(text, { language: lang }).value; } catch (e) {}
    }

    var hLines = highlighted ? highlighted.split('\n') : null;
    if (hLines && hLines.length > 0 && hLines[hLines.length - 1] === '') hLines.pop();

    var html = '<div style="overflow-x:auto;background:var(--code-bg)"><table class="code-table"><tbody>';
    for (var i = 0; i < lines.length; i++) {
      html += '<tr><td class="line-nr">' + (i + 1) + '</td>' +
        '<td class="line-code">' +
        (hLines ? hLines[i] || '' : escapeHtml(lines[i])) +
        '</td></tr>';
    }
    html += '</tbody></table></div>';
    document.getElementById('viewer-body').innerHTML = html;
  } catch (e) {
    document.getElementById('viewer-body').innerHTML =
      '<div class="loading">could not load file</div>';
  }
}

async function loadFiles() {
  try {
    var res = await fetch('./src/');
    var items = await res.json();

    var files = [];
    var dirs = [];
    for (var i = 0; i < items.length; i++) {
      var f = items[i];
      if (SKIP[f.name]) continue;
      if (f.type === 'directory') dirs.push(f);
      else files.push(f);
    }
    files.sort(function(a, b) { return a.name.localeCompare(b.name); });
    dirs.sort(function(a, b) { return a.name.localeCompare(b.name); });

    var sidebar = document.getElementById('sidebar');
    var loading = document.getElementById('files-loading');
    loading.remove();

    var ul = document.createElement('ul');
    ul.className = 'file-list';

    // Root files
    for (var i = 0; i < files.length; i++) {
      ul.appendChild(makeFileLink(files[i].name, './src/'));
    }

    // Subdirectories
    for (var i = 0; i < dirs.length; i++) {
      var dirName = dirs[i].name;
      var label = document.createElement('li');
      label.innerHTML = '<div class="dir-label">' + dirIconSvg() + ' ' + escapeHtml(dirName) + '/</div>';
      ul.appendChild(label);

      // Fetch subdirectory contents
      try {
        var subRes = await fetch('./src/' + dirName + '/');
        var subItems = await subRes.json();
        subItems.sort(function(a, b) { return a.name.localeCompare(b.name); });
        for (var j = 0; j < subItems.length; j++) {
          if (subItems[j].type === 'file') {
            ul.appendChild(makeFileLink(subItems[j].name, './src/' + dirName + '/', '  '));
          }
        }
      } catch(e) {}
    }

    sidebar.appendChild(ul);

    // Default: show README.md
    viewFile('README.md', './src/');
  } catch (e) {
    document.getElementById('files-loading').textContent = 'could not load file list';
  }
}

function makeFileLink(name, basePath, indent) {
  var li = document.createElement('li');
  var a = document.createElement('a');
  a.href = '#';
  a.setAttribute('data-file', name);
  a.setAttribute('data-base', basePath);
  a.innerHTML = (indent ? '<span style="width:14px;display:inline-block"></span>' : '') + fileIconSvg() + '<span>' + escapeHtml(name) + '</span>';
  a.onclick = function(e) {
    e.preventDefault();
    viewFile(this.getAttribute('data-file'), this.getAttribute('data-base'));
  };
  li.appendChild(a);
  return li;
}

loadFiles();
</script>
</body>
</html>
