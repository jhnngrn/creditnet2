<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>source code</title>
<style>
:root {
  --bg: #fdfdfc; --fg: #1a1a1a; --fg2: #666; --border: #ddd;
  --accent: #2255aa;
  --row-hover: #f6f6f4; --input-bg: #fff;
  --card-bg: #f8f8f7; --code-bg: #f4f4f2;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #131316; --fg: #e0e0de; --fg2: #999; --border: #2a2a2e;
    --accent: #6a9fff;
    --row-hover: #1e1e22; --input-bg: #1e1e22;
    --card-bg: #1a1a1e; --code-bg: #18181c;
  }
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, system-ui, sans-serif; background: var(--bg); color: var(--fg); line-height: 1.5; font-size: 15px; }
.wrap { max-width: 820px; margin: 0 auto; padding: 24px 20px; }
header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 28px; border-bottom: 1px solid var(--border); padding-bottom: 14px; }
header h1 { font-size: 18px; font-weight: 600; }
header a { font-size: 13px; color: var(--fg2); text-decoration: none; }
header a:hover { color: var(--fg); }
.section { margin-bottom: 28px; }
.section h2 { font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--fg2); margin-bottom: 10px; }
.tree { list-style: none; }
.tree li { border-bottom: 1px solid var(--border); }
.tree li:last-child { border-bottom: none; }
.file-row { display: flex; justify-content: space-between; align-items: baseline; padding: 8px 0; cursor: pointer; }
.file-row:hover { color: var(--accent); }
.file-name { font-family: ui-monospace, 'SF Mono', 'Cascadia Code', Menlo, monospace; font-size: 13px; }
.file-size { font-size: 12px; color: var(--fg2); font-variant-numeric: tabular-nums; }
.file-row.active .file-name { color: var(--accent); font-weight: 600; }
.dir-name { font-family: ui-monospace, 'SF Mono', 'Cascadia Code', Menlo, monospace; font-size: 13px; color: var(--fg2); padding: 6px 0; cursor: pointer; }
.dir-name:hover { color: var(--fg); }
.dir-name::before { content: '▸ '; font-size: 11px; }
.dir-name.open::before { content: '▾ '; }
.dir-children { padding-left: 16px; display: none; }
.dir-children.open { display: block; }
.code-wrap { background: var(--code-bg); border: 1px solid var(--border); border-radius: 6px; margin: 6px 0 10px; overflow-x: auto; }
.code-wrap pre { font-family: ui-monospace, 'SF Mono', 'Cascadia Code', Menlo, monospace; font-size: 12px; line-height: 1.55; padding: 14px 16px; margin: 0; color: var(--fg); white-space: pre; tab-size: 4; }
.loading { font-size: 13px; color: var(--fg2); padding: 10px 0; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>source code</h1>
    <a href="index.html">← back</a>
  </header>
  <div id="app"><p class="loading">loading…</p></div>
</div>
<script>
const SKIP = ['vendor', 'loops', '.git'];
const SECTIONS = [
  { title: 'creditnet', base: './src/' }
];

function esc(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function fmtSize(n) {
  if (n < 1024) return n + ' B';
  if (n < 1024*1024) return (n/1024).toFixed(1) + ' KB';
  return (n/(1024*1024)).toFixed(1) + ' MB';
}

async function fetchDir(path) {
  const r = await fetch(path);
  if (!r.ok) return [];
  return r.json();
}

async function fetchFile(path) {
  const r = await fetch(path);
  if (!r.ok) return '(error loading file)';
  return r.text();
}

function shouldSkip(name) {
  return SKIP.includes(name);
}

function isGoFile(name) {
  return name.endsWith('.go');
}

async function buildTree(base) {
  const entries = await fetchDir(base);
  const files = [];
  const dirs = [];
  for (const e of entries) {
    if (shouldSkip(e.name)) continue;
    if (e.type === 'directory') {
      dirs.push(e);
    } else if (isGoFile(e.name)) {
      files.push(e);
    }
  }
  files.sort((a,b) => a.name.localeCompare(b.name));
  dirs.sort((a,b) => a.name.localeCompare(b.name));
  return { files, dirs, base };
}

function createFileRow(entry, base) {
  const li = document.createElement('li');
  const row = document.createElement('div');
  row.className = 'file-row';
  row.innerHTML = `<span class="file-name">${esc(entry.name)}</span><span class="file-size">${fmtSize(entry.size)}</span>`;

  let codeWrap = null;
  let loaded = false;

  row.addEventListener('click', async () => {
    if (codeWrap) {
      codeWrap.remove();
      codeWrap = null;
      row.classList.remove('active');
      return;
    }
    row.classList.add('active');
    codeWrap = document.createElement('div');
    codeWrap.className = 'code-wrap';
    codeWrap.innerHTML = '<pre>loading…</pre>';
    li.appendChild(codeWrap);
    if (!loaded) {
      const src = await fetchFile(base + entry.name);
      loaded = true;
      codeWrap.innerHTML = '<pre>' + esc(src) + '</pre>';
    }
  });

  li.appendChild(row);
  return li;
}

function createDirNode(entry, base) {
  const container = document.createElement('li');
  const label = document.createElement('div');
  label.className = 'dir-name';
  label.textContent = entry.name + '/';
  container.appendChild(label);

  const children = document.createElement('ul');
  children.className = 'tree dir-children';
  container.appendChild(children);

  let fetched = false;

  label.addEventListener('click', async () => {
    if (!fetched) {
      fetched = true;
      const tree = await buildTree(base + entry.name + '/');
      for (const d of tree.dirs) {
        children.appendChild(createDirNode(d, tree.base));
      }
      for (const f of tree.files) {
        children.appendChild(createFileRow(f, tree.base));
      }
      if (tree.files.length === 0 && tree.dirs.length === 0) {
        const empty = document.createElement('li');
        empty.innerHTML = '<span class="loading">(no .go files)</span>';
        children.appendChild(empty);
      }
    }
    label.classList.toggle('open');
    children.classList.toggle('open');
  });

  return container;
}

async function init() {
  const app = document.getElementById('app');
  app.innerHTML = '';

  for (const sec of SECTIONS) {
    const section = document.createElement('div');
    section.className = 'section';
    section.innerHTML = `<h2>${esc(sec.title)}</h2>`;

    const ul = document.createElement('ul');
    ul.className = 'tree';

    const tree = await buildTree(sec.base);
    for (const d of tree.dirs) {
      ul.appendChild(createDirNode(d, tree.base));
    }
    for (const f of tree.files) {
      ul.appendChild(createFileRow(f, tree.base));
    }

    section.appendChild(ul);
    app.appendChild(section);
  }
}

init();
</script>
</body>
</html>
